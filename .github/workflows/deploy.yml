name: Deploy XLVI Photobooth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase build configuration
        run: |
          node -e '
            const rawUrl = process.env.VITE_SUPABASE_URL || "";
            const anonKey = process.env.VITE_SUPABASE_ANON_KEY || "";
            const baseUrl = rawUrl.trim()
              .replace(/^["\x27]+|["\x27]+$/g, "")
              .replace(/\/+$/, "")
              .replace(/\/(rest|storage|auth)(\/v\d+)?(\/.*)?$/i, "");
            let validUrl = false;
            try {
              const parsed = new URL(baseUrl);
              validUrl = ["https:", "http:"].includes(parsed.protocol) && !!parsed.hostname;
            } catch {}
            if (!validUrl || anonKey.trim().length < 20 || /^\*+$/.test(anonKey.trim())) {
              console.error("Supabase URL/key GitHub Environment secrets are missing or invalid; no values were printed.");
              process.exit(1);
            }
          '
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
